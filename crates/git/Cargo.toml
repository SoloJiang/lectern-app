[package]
name = "lectern-git"
description = "Repository reading with gix, imara-diff and structural diff."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.lectern]
layer = "domain"

[features]
# `testing::TestRepo`: builds repositories with gix, without the git CLI, for
# the tests of this crate and of project, review and bench.
test-support = ["dep:tempfile"]

[dependencies]
gix.workspace = true
# `WorktreeSource` / `PathFilter`, implemented by `Worktree::watch_source`.
lectern-fs-watch = { path = "../fs_watch" }
lectern-platform = { path = "../platform" }
# `ChangeSource` and its types, implemented by `LocalChanges` (kernel layer).
lectern-services = { path = "../services" }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
# `watch_source_events_*`: the filter driven by a manual fs_watch watcher.
lectern-executor = { path = "../executor", features = ["test-support"] }
lectern-fs-watch = { path = "../fs_watch", features = ["test-support"] }

# mkfifo for the FIFO test (already in the lock file through platform).
[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix.workspace = true

[lints]
workspace = true
