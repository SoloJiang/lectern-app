[package]
name = "lectern-cache"
description = "Content-addressed SQLite cache keyed by git blob OID."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.lectern]
layer = "infra"

[features]
# testing::ManualClock and fault injection (a page limit on the write
# connection, a hook inside write transactions), for the tests of this crate
# and of the crates that use it.
test-support = []

[dependencies]
lectern-logging = { path = "../logging" }
rusqlite.workspace = true
ruzstd.workspace = true
sha2.workspace = true

[dev-dependencies]
insta.workspace = true
# testing::capture for the logs_* tests (docs/design/cache.md「日志与诊断」).
lectern-logging = { path = "../logging", features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
