[package]
name = "lectern-project-home"
description = "Project overview and project sidebar."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.lectern]
layer = "view"
# The "project-home" and "project-home-usage" plugins (docs/design/project_home.md
# 「依赖」, ADR 0025): they require services only and are depended on by `app`.
plugin = true

[dependencies]
# Views, `uniform_list`, Action (docs/design/project_home.md「依赖」). The views
# make this crate macOS-only (「测试」).
gpui.workspace = true
# The views' wake channel: `channel::mpsc::unbounded`, sent from the executor
# threads and received by a GPUI foreground task, as in `lectern-workspace`.
futures.workspace = true
# `keys::project_home::*`, `Args`, `count_compact`, `Strings::relative_time` (ADR 0013).
lectern-i18n = { path = "../i18n" }
# The `Background` task that composes the snapshot.
lectern-executor = { path = "../executor" }
# `Plugin`, `Context`, `PluginHandle`, `ServiceRef`, `ServiceSet`, `ActivationToken`.
lectern-kernel = { path = "../kernel" }
# Runtime logging (docs/design/project_home.md「日志与诊断」, ADR 0046).
lectern-logging = { path = "../logging" }
# `dyn Projects`, `dyn SessionSource`, `dyn Review`, `dyn Usage`, `dyn Contributions`
# and their data types and events.
lectern-services = { path = "../services" }
# `GroupedList`, `Row`, `AgentDot`, `Progress`, `Skeleton`, `Text`, `TextRole`,
# colours, motion, `semantic` and the `contrib` payload types (ADR 0015). A
# library crate of the view layer, not a plugin.
lectern-ui = { path = "../ui" }

[features]
# `fixture`: the inputs of the `project_home/build_1000` bench
# (docs/design/project_home.md「性能」), for `lectern-bench`.
test-support = []

[dev-dependencies]
# `TestAppContext`, `VisualTestContext`, `#[gpui::test]`.
gpui = { workspace = true, features = ["test-support"] }
# Snapshot tests of `snapshot::build` and of the semantic trees (AGENTS.md).
insta.workspace = true
# `Executor::manual`: the composing task runs when a test says so.
lectern-executor = { path = "../executor", features = ["test-support"] }
# `Kernel::barrier`, `ManualClock`: the plugins run in a real kernel.
lectern-kernel = { path = "../kernel", features = ["test-support"] }
# `testing::capture` for the canary test.
lectern-logging = { path = "../logging", features = ["test-support"] }

[lints]
workspace = true
