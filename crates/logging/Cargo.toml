[package]
name = "lectern-logging"
description = "Runtime logging: typed call sites, correlation scopes and the on-disk sink."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.lectern]
layer = "kernel"

# The only dependency is the `log` facade (docs/design/logging.md「依赖」):
# kernel crates depend only on kernel crates.
[dependencies]
log.workspace = true

[features]
# The on-disk part: `install_early`, the writer thread, rotation and
# cleanup, verbose logging, the panic hook, export. Only `app` and tool
# crates enable it (scripts/check_architecture.py).
sink = []
# `testing`: capture records in other crates' tests (canary tests), and the
# entry points lectern-bench needs.
test-support = []

[dev-dependencies]
insta.workspace = true
serde_json.workspace = true
tempfile.workspace = true
trybuild.workspace = true

[lints]
workspace = true
