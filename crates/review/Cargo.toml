[package]
name = "lectern-review"
description = "Change attribution, hunk alignment, reviewed state and review notes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.lectern]
layer = "domain"

[features]
# `testing`: the annotation log fixture of `review/log_load_16k`, the change
# chain fixture of `review/chain_3000_lines`, and `FakeSessions`,
# `FakeProjects` and `Driven` with the review engine's fixtures, for the tests
# and lectern-bench (docs/design/review.md「测试」). `Driven` runs the engine
# on `Executor::manual()`, its repositories are `TestRepo`s.
test-support = ["lectern-executor/test-support", "lectern-git/test-support"]

[dependencies]
# `review.attribution`, `review.tree_changes` and `review.claims`
# (docs/design/review.md「归因的缓存」).
lectern-cache = { path = "../cache" }
# The review engine's tasks: no IO on the calling thread.
lectern-executor = { path = "../executor" }
# `line_diff`, `Oid::for_blob`, `LocalChanges`, `head_reflog`,
# `tree_changes`, `mtimes`, `rows` and `inline_changes`; gix stays in git.
lectern-git = { path = "../git" }
lectern-services = { path = "../services" }
# The annotation log's records (docs/adr/0044.md).
serde.workspace = true
serde_json.workspace = true
# The annotation log's file name, as cache names its partitions.
sha2.workspace = true

[dev-dependencies]
insta.workspace = true
lectern-executor = { path = "../executor", features = ["test-support"] }
lectern-git = { path = "../git", features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
