[package]
name = "lectern-usage"
description = "Token dedupe, attribution and aggregation in SQLite, and limit snapshots."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.lectern]
layer = "domain"
plugin = true

[features]
# testing::FakeSessions, FakeProjects, TableZone, ManualTime, Scenario and the
# heavy_days fixture, for the tests of this crate and for lectern-bench.
test-support = [
    "lectern-kernel/test-support",
    "lectern-executor/test-support",
]

[dependencies]
# The statusline directory's watch (`watch_dir`).
lectern-fs-watch = { path = "../fs_watch" }
# Background tasks (reading, snapshots, the database). Timers are not tasks:
# they are waker callbacks on the kernel's `Clock` (see src/time.rs).
lectern-executor = { path = "../executor" }
# Plugin, PluginHandle, BusyGuard, Quiescent / Busy, Clock.
lectern-kernel = { path = "../kernel" }
# Typed log records (ADR 0046); the sink stays in app.
lectern-logging = { path = "../logging" }
# Usage (provided), SessionSource and Projects (required).
lectern-services = { path = "../services" }
# This crate's own database (ADR 0027).
rusqlite.workspace = true
# The cold segments' compression (docs/design/usage.md「冷热分层」, ADR 0026).
ruzstd.workspace = true
# The statusline file's JSON (src/limits.rs) and the record scripts of
# testing::FakeSessions.
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
insta.workspace = true
lectern-executor = { path = "../executor", features = ["test-support"] }
lectern-kernel = { path = "../kernel", features = ["test-support"] }
lectern-logging = { path = "../logging", features = ["test-support"] }
# FakeBackend and the manually driven watcher.
lectern-fs-watch = { path = "../fs_watch", features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
