[package]
name = "lectern-fs-watch"
description = "Platform-neutral file watching, filtered by the git index; the FSEvents backend lives in platform."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.lectern]
layer = "infra"

[features]
# `testing`: FakeBackend, the manually driven watcher, RecordingSink and
# FakeSource, for the tests of this crate and of git, project, agents, review,
# usage and bench. The manual watcher drives an `Executor::manual()`.
test-support = ["lectern-executor/test-support"]

[dependencies]
lectern-kernel = { path = "../kernel" }
lectern-executor = { path = "../executor" }
# The runtime log's macros and typed fields (diag.rs, ADR 0046).
lectern-logging = { path = "../logging" }

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
lectern-executor = { path = "../executor", features = ["test-support"] }
# TestKernel, for the quiescence tests.
lectern-kernel = { path = "../kernel", features = ["test-support"] }
# testing::capture for the logs_* tests (docs/design/fs_watch.md「日志与诊断」).
lectern-logging = { path = "../logging", features = ["test-support"] }

[lints]
workspace = true
