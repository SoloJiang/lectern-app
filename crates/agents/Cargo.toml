[package]
name = "lectern-agents"
description = "Claude Code and Codex session parsing; ACP client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.lectern]
layer = "domain"
plugin = true

[features]
# `testing::parse_file` and the synthetic sessions, for tests and lectern-bench
# (docs/design/agents.md).
test-support = []

[dependencies]
lectern-kernel = { path = "../kernel" }
lectern-services = { path = "../services" }
lectern-executor = { path = "../executor" }
lectern-fs-watch = { path = "../fs_watch" }
lectern-cache = { path = "../cache" }
serde.workspace = true
# `raw_value`: tool inputs are kept as borrowed raw JSON and only parsed for
# the tools the adapter classifies, and `load` returns them verbatim.
serde_json = { workspace = true, features = ["raw_value"] }
# Codex `.jsonl.zst` sessions (docs/design/agents.md「压缩会话的随机读取」).
ruzstd.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
lectern-kernel = { path = "../kernel", features = ["test-support"] }
lectern-executor = { path = "../executor", features = ["test-support"] }
lectern-fs-watch = { path = "../fs_watch", features = ["test-support"] }

[lints]
workspace = true
