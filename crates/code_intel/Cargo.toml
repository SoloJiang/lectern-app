[package]
name = "lectern-code-intel"
description = "tree-sitter symbol index, Java and TypeScript resolution, dependency sources."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.lectern]
layer = "domain"
plugin = true

[features]
# testing::ManualClock, FakeGrammars, FakeGit, FakeProjects, the
# language fixtures, the synthetic repositories, a watchdog on an executor's
# dedicated thread and a kernel host, for the tests of this crate and for
# lectern-bench.
test-support = [
    "dep:tempfile",
    "lectern-kernel/test-support",
    "lectern-fs-watch/test-support",
    "lectern-executor/test-support",
]

[dependencies]
# The indexer's tasks (Interactive, Background, Batch) and the watchdog's
# dedicated thread.
lectern-executor = { path = "../executor" }
# PluginHandle, BusyGuard and BackgroundGuard (ADR 0029).
lectern-kernel = { path = "../kernel" }
# The worktree comparison, HEAD, the index checksum, blobs and canonical
# OIDs (git_access.rs); gix stays inside lectern-git.
lectern-git = { path = "../git" }
# The current worktree's WorktreeBatch (index/watch.rs).
lectern-fs-watch = { path = "../fs_watch" }
# SafeRoot: worktree files are read only through it.
lectern-platform = { path = "../platform" }
tempfile = { workspace = true, optional = true }
# The custom tables of `code_intel.tags` (store.rs); SQL goes through its
# interface, so rusqlite stays a dependency of lectern-cache only.
lectern-cache = { path = "../cache" }
# The shared code_intel types (LangName, DefKind, RefSyntax, Position).
lectern-services = { path = "../services" }
# The dependency tier's manifests (an ordered JSON value) and the streamed
# identities of npm's lockfile (`Deserializer::from_reader` with
# `IgnoredAny`, ADR 0033); both already in Cargo.lock.
serde.workspace = true
serde_json.workspace = true
streaming-iterator.workspace = true
# The time-boxed search's whole-word lookup (`memmem`).
memchr.workspace = true
# The name table's names are NFC (ADR 0030: frizbee does not normalize).
unicode-normalization.workspace = true
tree-sitter.workspace = true
tree-sitter-tags.workspace = true
tree-sitter-go.workspace = true
tree-sitter-java.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-python.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true

[dev-dependencies]
insta.workspace = true
lectern-cache = { path = "../cache", features = ["test-support"] }
lectern-executor = { path = "../executor", features = ["test-support"] }
lectern-fs-watch = { path = "../fs_watch", features = ["test-support"] }
lectern-git = { path = "../git", features = ["test-support"] }
lectern-kernel = { path = "../kernel", features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
