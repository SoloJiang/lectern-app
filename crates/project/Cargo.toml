[package]
name = "lectern-project"
description = "Repository, worktree and sub-project model; manifest parsing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.lectern]
layer = "domain"
plugin = true

[features]
# `testing::FakeGit`: an in-memory git for the tests of this crate and of
# app and bench (docs/design/project.md「测试」). Its worktrees answer
# `watch_source` with fs_watch's `FakeSource`.
test-support = ["dep:tempfile", "lectern-fs-watch/test-support"]

[dependencies]
lectern-kernel = { path = "../kernel" }
lectern-services = { path = "../services" }
lectern-git = { path = "../git" }
lectern-executor = { path = "../executor" }
lectern-platform = { path = "../platform" }
lectern-fs-watch = { path = "../fs_watch" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
quick-xml.workspace = true
glob.workspace = true
tempfile = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
lectern-git = { path = "../git", features = ["test-support"] }
lectern-kernel = { path = "../kernel", features = ["test-support"] }
lectern-executor = { path = "../executor", features = ["test-support"] }
lectern-fs-watch = { path = "../fs_watch", features = ["test-support"] }

[lints]
workspace = true
