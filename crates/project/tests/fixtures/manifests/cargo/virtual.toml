# Sanitized sample: a virtual manifest (no [package]).
[workspace]
resolver = "3"
members = [
    "crates/*",
    "tools/xtask",
    "examples/**",
]
exclude = ["crates/experimental", "examples/wasm"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
