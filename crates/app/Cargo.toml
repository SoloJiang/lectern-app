[package]
name = "lectern-app"
description = "Lectern app entry: startup, plugin assembly per profile, window snapshot restore."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "lectern"
path = "src/main.rs"

[package.metadata.lectern]
layer = "app"

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
# The channels of the window state task and of `Quit`'s leave question: the
# callbacks of `workspace` run on any thread and have no `cx`.
futures.workspace = true
# The plugin crates and the resources they share (docs/design/app.md「装配」).
lectern-agents = { path = "../agents" }
lectern-cache = { path = "../cache" }
lectern-executor = { path = "../executor" }
lectern-fs-watch = { path = "../fs_watch" }
lectern-i18n = { path = "../i18n" }
lectern-kernel = { path = "../kernel" }
# The on-disk sink: install_early, the writer thread, shutdown
# (docs/design/app.md「启动顺序」). Only app and tool crates enable `sink`.
lectern-logging = { path = "../logging", features = ["sink"] }
lectern-platform = { path = "../platform" }
lectern-project = { path = "../project" }
lectern-review = { path = "../review" }
# `LeaveScope`, for the leave guards `Quit` asks.
lectern-services = { path = "../services" }
# `init` before the window, `attach` on the skeleton window, `ready` behind
# the barrier (docs/design/ui.md「对其他 crate 的要求」).
lectern-ui = { path = "../ui" }
# The "workspace" plugin, `install` and `WindowState`
# (docs/design/workspace.md「对其他 crate 的要求」E).
lectern-workspace = { path = "../workspace" }
# `window.json`, and the startup tests read the log file's JSON lines.
serde_json.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# `testing::FakeBackend` for the profile graph test.
lectern-fs-watch = { path = "../fs_watch", features = ["test-support"] }
# testing::capture() for the canary test.
lectern-logging = { path = "../logging", features = ["sink", "test-support"] }
# `testing::simulate_appearance_change` for the skeleton window tests.
lectern-ui = { path = "../ui", features = ["test-support"] }
# `Theme`: the before-ready test checks that no theme global exists.
gpui-component.workspace = true
# `Executor::manual`: the window state tests run the write when they say so.
lectern-executor = { path = "../executor", features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
