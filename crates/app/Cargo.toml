[package]
name = "lectern-app"
description = "Lectern app entry: startup, plugin assembly per profile, window snapshot restore."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "lectern"
path = "src/main.rs"

[package.metadata.lectern]
layer = "app"

[features]
# The UI probe (docs/design/ui_probe.md「对其他 crate 的要求」): not in
# `default`, so a plain `cargo build` has no `lectern-ui-probe`. `just check`
# and `just test` use `--all-features`; `just probe` builds with it.
ui-probe = ["dep:lectern-ui-probe"]
# The measurement build (docs/design/app.md「测量构建的装配」): not in
# `default`, so a plain `cargo build` has no `lectern-bench` and no method
# replacements in `lectern-platform` (ADR 0048). `lectern-bench/probe` turns
# on `lectern-platform/bench-hooks`. `just bench` builds with it.
bench-probe = ["dep:lectern-bench", "lectern-bench/probe"]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
# The channels of the window state task and of `Quit`'s leave question: the
# callbacks of `workspace` run on any thread and have no `cx`.
futures.workspace = true
# The plugin crates and the resources they share (docs/design/app.md「装配」).
lectern-agents = { path = "../agents" }
lectern-cache = { path = "../cache" }
lectern-executor = { path = "../executor" }
lectern-fs-watch = { path = "../fs_watch" }
lectern-i18n = { path = "../i18n" }
lectern-kernel = { path = "../kernel" }
# The on-disk sink: install_early, the writer thread, shutdown
# (docs/design/app.md「启动顺序」). Only app and tool crates enable `sink`.
lectern-logging = { path = "../logging", features = ["sink"] }
lectern-platform = { path = "../platform" }
lectern-project = { path = "../project" }
# The "project-home" and "project-home-usage" plugins and their shared
# `UsageSlot` (docs/design/project_home.md「对其他 crate 的要求」D).
lectern-project-home = { path = "../project_home" }
lectern-review = { path = "../review" }
# The "review-view" plugin (docs/design/review_view.md「对其他 crate 的要求」C).
# Its "review-view-handoff" is not assembled: no plugin provides `dyn Reader`.
lectern-review-view = { path = "../review_view" }
# The "worktrees" and "worktrees-usage" plugins and their shared `UsageLink`
# (docs/design/worktrees.md「对其他 crate 的要求」D).
lectern-worktrees = { path = "../worktrees" }
# The "terminal" plugin and `TerminalDeps`
# (docs/design/terminal.md「对其他 crate 的要求」6).
lectern-terminal = { path = "../terminal" }
# The "welcome" and "welcome-discovery" plugins and `WelcomeDeps`
# (docs/design/welcome.md「对其他 crate 的要求」C).
lectern-welcome = { path = "../welcome" }
# The probe of the measurement build (optional: a tool crate, the only form
# architecture rule 2 allows).
lectern-bench = { path = "../bench", optional = true }
# The probe session of the probe profile (optional: a tool crate, the only
# form architecture rule 2 allows).
lectern-ui-probe = { path = "../ui_probe", optional = true }
# `LeaveScope`, for the leave guards `Quit` asks.
lectern-services = { path = "../services" }
# The "usage" plugin, `UsageDeps` and `LocalZone`
# (docs/design/usage.md「对其他 crate 的要求」C).
lectern-usage = { path = "../usage" }
# `init` before the window, `attach` on the skeleton window, `ready` behind
# the barrier (docs/design/ui.md「对其他 crate 的要求」).
lectern-ui = { path = "../ui" }
# The "workspace" plugin, `install` and `WindowState`
# (docs/design/workspace.md「对其他 crate 的要求」E).
lectern-workspace = { path = "../workspace" }
# `window.json`, and the startup tests read the log file's JSON lines.
serde_json.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# `testing::FakeBackend` for the profile graph test.
lectern-fs-watch = { path = "../fs_watch", features = ["test-support"] }
# testing::capture() for the canary test.
lectern-logging = { path = "../logging", features = ["sink", "test-support"] }
# `testing::simulate_appearance_change` for the skeleton window tests.
lectern-ui = { path = "../ui", features = ["test-support"] }
# `Theme`: the before-ready test checks that no theme global exists.
gpui-component.workspace = true
# `Executor::manual`: the window state tests run the write when they say so.
lectern-executor = { path = "../executor", features = ["test-support"] }
tempfile.workspace = true
# `tests/probe.rs` decodes the screenshot's PNG.
image.workspace = true

[lints]
workspace = true
