name: CI

on:
  push:
    branches: [main]
  pull_request:
  # By hand, for the judge job on a chosen branch (docs/design/ci.md「判定机器」).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Fast checks that do not need macOS: formatting, architecture rules,
  # licenses, and clippy + tests for every crate that builds without GPUI.
  checks:
    name: Checks (Linux, GPUI-free crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny,cargo-nextest
      - name: Check (fmt, architecture rules, clippy)
        run: just check
      - name: Licenses, sources and advisories
        run: just deny
      - name: Tests
        run: just test --profile ci
      - name: Annotate failed tests
        if: failure()
        run: python3 scripts/ci_annotate_failures.py
      - name: Doctests
        run: just doctest
      # A smoke run: every in-process benchmark once on small inputs, so a
      # broken benchmark or an unregistered budget fails here.
      - name: Performance budget benchmarks (smoke)
        run: just bench

  # Full workspace, including GPUI, on Apple Silicon.
  macos:
    name: Build and test (macOS arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Metal toolchain
        # Run metal: on Xcode 26 the launcher can exist without the toolchain.
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - uses: Swatinem/rust-cache@v2
        with:
          # Debug builds only; the benchmarks job caches its release build
          # under its own key, so neither evicts the other.
          key: test
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - name: Check (fmt, architecture rules, clippy)
        run: just check
      - name: Tests
        run: just test --profile ci
      - name: Annotate failed tests
        if: failure()
        run: python3 scripts/ci_annotate_failures.py
      - name: Doctests
        run: just doctest
      - name: Build app
        run: cargo build --locked -p lectern-app

  # The performance budgets, judged on Apple Silicon, in parallel with the
  # job above (docs/design/ci.md「任务」). This runner never gives a
  # presentedTime, so the budgets that end at the first frame are only
  # recorded here; the judge job below judges them (ADR 0052).
  macos-bench:
    name: Benchmarks (macOS arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Metal toolchain
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
      # The benchmarks' kept fixtures (ADR 0039): this key decides how often
      # the restore hits. Each fixture checks its contents against the
      # current writer before use; the source hash is a second guard that
      # also covers changes the sampled check cannot see.
      - name: Restore the benchmarks' kept fixtures
        uses: actions/cache@v4
        with:
          path: target/lectern-bench/fixtures
          key: bench-fixtures-${{ runner.os }}-${{ hashFiles('crates/code_intel/src/**', 'crates/cache/src/**', 'crates/bench/benches/fixtures/**', 'Cargo.lock') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Performance budget benchmarks
        run: just bench
      # The report is uploaded even when a budget is exceeded.
      - name: Upload the benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lectern-bench-report
          path: target/lectern-bench/report.json
          if-no-files-found: warn

  # The budgets that end at the first frame, judged on the self-hosted
  # physical Mac (ADR 0052, docs/design/ci.md「判定机器」). The repository is
  # public, so the runner runs only code on main, or a branch of this
  # repository that a person with write access chose (workflow_dispatch),
  # never a pull request's code by itself. The job runs only once the repository
  # variable says the runner is registered. It fetches no tools (the
  # toolchain and just are installed read-only on the machine), keeps its
  # homes and temporary files under RUNNER_TEMP, has a read-only token and
  # no secrets, pins its actions to commits, cleans the workspace before
  # and after, and at the end ends every process it started.
  judge:
    name: Judge (physical Mac)
    if: >-
      vars.LECTERN_JUDGE_RUNNER == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, macOS, ARM64, lectern-judge]
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RUSTUP_HOME: /opt/lectern-judge/rustup
      RUSTUP_AUTO_INSTALL: '0'
    steps:
      # RUNNER_TEMP is emptied at the start and end of each job. The list of
      # this user's processes before the job starts any is for the last step.
      - name: Use per-job homes and the read-only tools
        run: |
          ps -U "$(id -u)" -o pid= > "$RUNNER_TEMP/pids-at-start"
          mkdir -p "$RUNNER_TEMP/home" "$RUNNER_TEMP/cargo" "$RUNNER_TEMP/tmp"
          {
            echo "HOME=$RUNNER_TEMP/home"
            echo "CARGO_HOME=$RUNNER_TEMP/cargo"
            echo "TMPDIR=$RUNNER_TEMP/tmp"
          } >> "$GITHUB_ENV"
          echo /opt/lectern-judge/cargo/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          clean: true
      # Fails instead of installing: a missing tool is the machine's setup.
      - name: Check the pre-installed tools
        run: |
          rustc --version
          just --version
          xcrun metal --version
      - name: Judge the budgets that end at the first frame
        env:
          LECTERN_BENCH_JUDGE: '1'
        run: just bench baseline/ app/cold_start
      - name: Upload the judging report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lectern-bench-judge-report
          path: target/lectern-bench/report.json
          if-no-files-found: warn
      # Ends every process of this user that the job started and that still
      # runs, chosen by process ID, not by name or path: each one that is not
      # in the first step's list, except this step's shell, its ancestors
      # (the runner) and its children. A process that already ran before the
      # job is out of reach (ADR 0052, known limitations). More rounds catch
      # one that forks while the others are ended.
      - name: End the job's processes and clean the workspace
        if: always()
        run: |
          start="$RUNNER_TEMP/pids-at-start"
          now="$RUNNER_TEMP/pids-now"
          if [ ! -f "$start" ]; then
            echo "::warning::No list of processes from the first step: none ended"
          else
            for round in 1 2 3 4 5; do
              ps -U "$(id -u)" -o pid=,ppid= > "$now"
              left=$(awk -v me=$$ '
                FILENAME == ARGV[1] { before[$1]; next }
                { parent[$1] = $2; pids[++n] = $1 }
                END {
                  for (q = me; (q in parent) && h++ < 64; q = parent[q]) keep[q]
                  for (i = 1; i <= n; i++) {
                    p = pids[i]
                    if ((p in before) || (p in keep)) continue
                    mine = 0; h = 0
                    for (q = parent[p]; (q in parent) && h++ < 64; q = parent[q])
                      if (q == me) { mine = 1; break }
                    if (!mine) print p
                  }
                }' "$start" "$now")
              if [ -z "$left" ]; then break; fi
              echo "Round $round ends:" $left
              kill -9 $left 2>/dev/null || true
              sleep 1
            done
          fi
          git clean -ffdx && git reset --hard
