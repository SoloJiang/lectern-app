name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Fast checks that do not need macOS: formatting, architecture rules,
  # licenses, and clippy + tests for every crate that builds without GPUI.
  checks:
    name: Checks (Linux, GPUI-free crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny,cargo-nextest
      - name: Check (fmt, architecture rules, clippy)
        run: just check
      - name: Licenses, sources and advisories
        run: just deny
      - name: Tests
        run: just test --profile ci
      - name: Annotate failed tests
        if: failure()
        run: python3 scripts/ci_annotate_failures.py
      - name: Doctests
        run: just doctest
      # A smoke run: every in-process benchmark once on small inputs, so a
      # broken benchmark or an unregistered budget fails here.
      - name: Performance budget benchmarks (smoke)
        run: just bench

  # Full workspace, including GPUI, on Apple Silicon.
  macos:
    name: Build and test (macOS arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Metal toolchain
        # Run metal: on Xcode 26 the launcher can exist without the toolchain.
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - uses: Swatinem/rust-cache@v2
        with:
          # Debug builds only; the benchmarks job caches its release build
          # under its own key, so neither evicts the other.
          key: test
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - name: Check (fmt, architecture rules, clippy)
        run: just check
      - name: Tests
        run: just test --profile ci
      - name: Annotate failed tests
        if: failure()
        run: python3 scripts/ci_annotate_failures.py
      - name: Doctests
        run: just doctest
      - name: Build app
        run: cargo build --locked -p lectern-app

  # The performance budgets, judged on Apple Silicon, in parallel with the
  # job above (docs/design/ci.md「任务」). This runner never gives a
  # presentedTime, so the budgets that end at the first frame are only
  # recorded here; the judge job below judges them (ADR 0052).
  macos-bench:
    name: Benchmarks (macOS arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Metal toolchain
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
      # The benchmarks' kept fixtures (ADR 0039): this key decides how often
      # the restore hits. Each fixture checks its contents against the
      # current writer before use; the source hash is a second guard that
      # also covers changes the sampled check cannot see.
      - name: Restore the benchmarks' kept fixtures
        uses: actions/cache@v4
        with:
          path: target/lectern-bench/fixtures
          key: bench-fixtures-${{ runner.os }}-${{ hashFiles('crates/code_intel/src/**', 'crates/cache/src/**', 'crates/bench/benches/fixtures/**', 'Cargo.lock') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Performance budget benchmarks
        run: just bench
      # The report is uploaded even when a budget is exceeded.
      - name: Upload the benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lectern-bench-report
          path: target/lectern-bench/report.json
          if-no-files-found: warn

  # The budgets that end at the first frame, judged on the self-hosted
  # physical Mac (ADR 0052, docs/design/ci.md「判定机器」). The repository is
  # public, so: the job runs only once the repository variable says the
  # runner is registered, never for a fork's pull request, with no secrets,
  # a read-only token and a workspace cleaned before and after.
  judge:
    name: Judge (physical Mac)
    if: >-
      vars.LECTERN_JUDGE_RUNNER == 'true' &&
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, lectern-judge]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Metal toolchain
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      # No build cache: nothing a job builds is kept for the next one.
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Judge the budgets that end at the first frame
        env:
          LECTERN_BENCH_JUDGE: '1'
        run: just bench baseline/ app/cold_start
      - name: Upload the judging report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lectern-bench-judge-report
          path: target/lectern-bench/report.json
          if-no-files-found: warn
      # Also ends a measured process that a cancelled run left behind; this
      # user runs nothing else under these names.
      - name: Clean the workspace
        if: always()
        run: |
          pkill -x empty_window || true
          pkill -x lectern || true
          git clean -ffdx && git reset --hard
