name: CI

on:
  push:
    branches: [main]
  pull_request:
  # By hand, for the judge job on a chosen branch (docs/design/ci.md「判定机器」).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Fast checks that do not need macOS: formatting, architecture rules,
  # licenses, and clippy + tests for every crate that builds without GPUI.
  checks:
    name: Checks (Linux, GPUI-free crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny,cargo-nextest
      - name: Check (fmt, architecture rules, clippy)
        run: just check
      - name: Licenses, sources and advisories
        run: just deny
      - name: Tests
        run: just test --profile ci
      - name: Annotate failed tests
        if: failure()
        run: python3 scripts/ci_annotate_failures.py
      - name: Doctests
        run: just doctest
      # A smoke run: every in-process benchmark once on small inputs, so a
      # broken benchmark or an unregistered budget fails here.
      - name: Performance budget benchmarks (smoke)
        run: just bench

  # Full workspace, including GPUI, on Apple Silicon.
  macos:
    name: Build and test (macOS arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Metal toolchain
        # Run metal: on Xcode 26 the launcher can exist without the toolchain.
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - uses: Swatinem/rust-cache@v2
        with:
          # Debug builds only; each benchmarks shard caches its release build
          # under its own key, so none evicts another.
          key: test
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - name: Check (fmt, architecture rules, clippy)
        run: just check
      - name: Tests
        run: just test --profile ci
      - name: Annotate failed tests
        if: failure()
        run: python3 scripts/ci_annotate_failures.py
      - name: Doctests
        run: just doctest
      - name: Build app
        run: cargo build --locked -p lectern-app

  # The performance budgets run in parallel shards on Apple Silicon, in
  # parallel with the job above (docs/design/ci.md「任务」, ADR 0053). A shard
  # runs only its own budgets and uploads its reports; it does not judge, so
  # it succeeds once the reports are written. The job after this one merges
  # them. The runner never gives a presentedTime, so the budgets that end at
  # the first frame are only recorded; the judge job below judges them
  # (ADR 0052).
  macos-bench-shard:
    name: Benchmarks shard (${{ matrix.shard }})
    runs-on: macos-15
    strategy:
      # One shard failing to build must not cancel the others: the merge job
      # then names what is missing.
      fail-fast: false
      matrix:
        # The names in crates/bench/src/shards.rs.
        shard: [code-intel, process, rest]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Metal toolchain
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - uses: Swatinem/rust-cache@v2
        with:
          # A full key match is never saved again. When the justfile's bench
          # recipe adds a build to a shard (each has its own dependency
          # features), bump the number, or that build recompiles its
          # dependencies on every run. The first run after a bump starts with
          # no cache.
          key: bench-${{ matrix.shard }}-1
      # The benchmarks' kept fixtures (ADR 0039): this key decides how often
      # the restore hits. Each fixture checks its contents against the
      # current writer before use; the source hash is a second guard that
      # also covers changes the sampled check cannot see. Only the
      # code-intel shard generates them.
      - name: Restore the benchmarks' kept fixtures
        if: matrix.shard == 'code-intel'
        uses: actions/cache@v4
        with:
          path: target/lectern-bench/fixtures
          key: bench-fixtures-${{ runner.os }}-${{ hashFiles('crates/code_intel/src/**', 'crates/cache/src/**', 'crates/bench/benches/fixtures/**', 'Cargo.lock') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Performance budget benchmarks (shard)
        run: just bench --shard ${{ matrix.shard }}
      # The reports are uploaded even when a benchmark target failed.
      - name: Upload the shard's reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-shard-${{ matrix.shard }}
          path: target/lectern-bench/report-*.json
          if-no-files-found: warn

  # Merges the shards' reports and judges the budgets. It reads only JSON,
  # so it runs on Linux, and it runs when a shard failed too: the merge says
  # what is missing. Its name stays the required check's name.
  macos-bench:
    name: Benchmarks (macOS arm64)
    needs: macos-bench-shard
    # Not always(): a run cancelled by a newer push has nothing to merge.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-report
      # One directory per shard: target/lectern-bench/shards/bench-shard-<name>.
      - name: Download the shards' reports
        uses: actions/download-artifact@v4
        with:
          pattern: bench-shard-*
          path: target/lectern-bench/shards
      # The merged report is written into the first directory. The summary
      # and the annotations are the merge's (docs/design/bench.md「报告」).
      - name: Merge and judge the performance budgets
        run: |
          mkdir -p target/lectern-bench/shards
          cargo run -q --locked -p lectern-bench --bin lectern-bench-report -- merge target/lectern-bench target/lectern-bench/shards/*/
      - name: Upload the benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lectern-bench-report
          path: target/lectern-bench/report.json
          if-no-files-found: warn

  # The budgets that end at the first frame, judged on the self-hosted
  # physical Mac (ADR 0052, docs/design/ci.md「判定机器」). The repository is
  # public, so the runner runs only code on main, or a branch of this
  # repository that a person with write access chose (workflow_dispatch),
  # never a pull request's code by itself. The job runs only once the repository
  # variable says the runner is registered. It fetches no tools (the
  # toolchain and just are installed read-only on the machine), keeps its
  # homes and temporary files under RUNNER_TEMP, has a read-only token and
  # no secrets, pins its actions to commits, and cleans the workspace before
  # and after; the runner's job-completed hook ends every process it started.
  judge:
    name: Judge (physical Mac)
    if: >-
      vars.LECTERN_JUDGE_RUNNER == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, macOS, ARM64, lectern-judge]
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RUSTUP_HOME: /opt/lectern-judge/rustup
      RUSTUP_AUTO_INSTALL: '0'
    steps:
      # RUNNER_TEMP is emptied at the start and end of each job.
      - name: Use per-job homes and the read-only tools
        run: |
          mkdir -p "$RUNNER_TEMP/home" "$RUNNER_TEMP/cargo" "$RUNNER_TEMP/tmp"
          {
            echo "HOME=$RUNNER_TEMP/home"
            echo "CARGO_HOME=$RUNNER_TEMP/cargo"
            echo "TMPDIR=$RUNNER_TEMP/tmp"
          } >> "$GITHUB_ENV"
          echo /opt/lectern-judge/cargo/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          clean: true
      # Fails instead of installing: a missing tool is the machine's setup.
      - name: Check the pre-installed tools
        run: |
          rustc --version
          just --version
          xcrun metal --version
      - name: Judge the budgets that end at the first frame
        env:
          LECTERN_BENCH_JUDGE: '1'
        run: just bench baseline/ app/cold_start
      - name: Upload the judging report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lectern-bench-judge-report
          path: target/lectern-bench/report.json
          if-no-files-found: warn
      # The job's processes are ended by the runner's job-completed hook
      # (scripts/judge-runner/job-completed.sh), which no workflow can skip.
      - name: Clean the workspace
        if: always()
        run: git clean -ffdx && git reset --hard
