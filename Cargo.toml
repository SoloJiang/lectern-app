[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/kernel",
    "crates/services",
    "crates/logging",
    "crates/ui",
    "crates/workspace",
    "crates/welcome",
    "crates/project_home",
    "crates/review_view",
    "crates/context_drawer",
    "crates/conversation",
    "crates/terminal_view",
    "crates/worktrees",
    "crates/usage_view",
    "crates/file_reader",
    "crates/project",
    "crates/agents",
    "crates/review",
    "crates/git",
    "crates/code_intel",
    "crates/syntax",
    "crates/terminal",
    "crates/usage",
    "crates/forge",
    "crates/cache",
    "crates/fs_watch",
    "crates/executor",
    "crates/platform",
    "crates/i18n",
    "crates/bench",
    "crates/ui_probe",
    "crates/doc_check",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

# Every crate inherits these with `[lints] workspace = true`; the architecture
# check fails when a crate doesn't. See docs/design/ci.md.
[workspace.lints.clippy]
# An #[allow] or #[expect] must say why: #[allow(lint, reason = "...")].
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
undocumented_unsafe_blocks = "warn"
# Runtime output goes through lectern-logging's macros, not stdout or stderr
# (ADR 0046, docs/design/logging.md「对其他 crate 的要求」). Tests are exempt
# through clippy.toml's allow-print-in-tests; the tool crates and build
# scripts allow them where they print, and the architecture check keeps
# every other crate from allowing them.
print_stderr = "warn"
print_stdout = "warn"

[workspace.dependencies]
# GPUI comes from Zed's crates.io snapshots (gpui-pre 0.3.9 = zed@93d7456),
# pinned to the exact snapshot gpui-component 0.7.3 was built against.
# Upgrade all three together. See docs/design/cargo-workspace.md.
gpui = { package = "gpui-pre", version = "=0.3.9" }
# font-kit is required on macOS: without it gpui_macos falls back to a no-op
# text system and renders no text.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit"] }
gpui-component = "=0.7.3"
# Used only by the lectern-doc-check tool crate.
html5gum = { version = "0.8", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# lectern-i18n: fluent-syntax runs only in build.rs (and tests); fluent-bundle,
# intl_pluralrules and unic-langid are the reference implementation in tests.
# None of them reach the app binary. See docs/design/i18n.md.
fluent-syntax = "0.12"
fluent-bundle = "0.16"
intl_pluralrules = "7.0"
unic-langid = "0.9"
# Manifest parsing, used only by lectern-project (docs/adr/0023.md). Default
# features off: toml without `display` (no writer), quick-xml without
# encoding or serde support. lectern-services also uses serde for its data
# types (JSON-RPC, ADR 0018); `rc` serializes their `Arc<str>` / `Arc<[T]>`.
serde = { version = "1.0", default-features = false, features = ["std", "derive", "rc"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }
quick-xml = { version = "0.42", default-features = false }
glob = "0.3"
# lectern-platform's safe read (docs/design/platform.md): openat2, openat,
# fstatat, fstat, readlinkat and read through a safe interface. Already in the
# release build with the same features, through GPUI's async-io / polling.
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }
# lectern-platform's `window::set_frame_autosave_name` takes any window that
# implements `HasWindowHandle`; GPUI's `Window` does (docs/design/platform.md
# 「窗口 frame 的 autosave」). Already in the release build through GPUI.
raw-window-handle = "0.6"
# Repository reading, used only by lectern-git (docs/adr/0024.md). Exact pin;
# upgrade in its own PR. `parallel` stays off: no `max-performance-safe`
# (it turns on `parallel` through `max-control`), only its two pack caches.
gix = { version = "=0.88.0", default-features = false, features = [
    "sha1",
    "sha256",
    "index",
    "revision",
    "attributes",
    "excludes",
    "blob-diff",
    "pack-cache-lru-static",
    "pack-cache-lru-dynamic",
] }
# lectern-agents: decodes Codex's `.jsonl.zst` rollouts (pure Rust, MIT;
# docs/adr/0026.md). Default features: `std`, and `hash` (twox-hash, MIT) to
# verify the frame checksum. Tests also use its encoder to build fixtures.
ruzstd = "0.9"
# lectern-cache's SQLite store (docs/adr/0027.md). Exact pin; upgrade in its
# own PR after the cache tests and benchmarks pass. Statically links the
# bundled SQLite; only the prepared statement cache is on (no extensions).
# Only lectern-cache and lectern-usage depend on it directly.
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "cache"] }
# lectern-cache: partition file names (docs/design/cache.md). The version
# gix-hash already uses; default features off.
sha2 = { version = "0.11", default-features = false }
# lectern-code-intel's symbol extraction (docs/adr/0030.md). Exact pins;
# tree-sitter and tree-sitter-tags upgrade together in their own PR, after the
# extraction snapshots and `code_intel/extract_throughput` pass. Default
# features off: only `std`, never `wasm` (no WASM host, architecture rule 3).
tree-sitter = { version = "=0.27.1", default-features = false, features = ["std"] }
tree-sitter-tags = "=0.27.1"
# Iterates tree-sitter query matches; already a dependency of tree-sitter-tags.
streaming-iterator = "0.1"
# lectern-code-intel: the time-boxed search's `memmem` and the name table's
# NFC (docs/design/code_intel.md「依赖」). Both already in Cargo.lock.
memchr = "2.8"
unicode-normalization = "0.1.26"
# lectern-syntax: long lines are folded by character cells
# (docs/design/file_reader.md「依赖」). Already in Cargo.lock; MIT OR Apache-2.0.
unicode-width = "0.2"
# First-release grammars (docs/design/code_intel.md「未决问题」1, default (a)):
# the newest release of each whose ABI tree-sitter 0.27.1 loads, MIT. Shared
# with the highlighter (file_reader); the versions are repeated in
# crates/code_intel/src/lang.rs and checked against Cargo.lock by
# `lang_grammar_versions_match_lock`.
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-java = "=0.23.5"
tree-sitter-python = "=0.25.0"
tree-sitter-go = "=0.25.0"
# The highlighter's other core languages (docs/adr/0041.md), MIT; their only
# normal dependency is tree-sitter-language. The versions are repeated in
# crates/syntax/src/lang.rs and checked against Cargo.lock by
# `lang_grammar_versions_match_lock`. tree-sitter-md without `parser`: that
# feature pulls in tree-sitter 0.26; only the block grammar is used.
tree-sitter-json = "=0.24.8"
tree-sitter-yaml = "=0.7.2"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-md = { version = "=0.5.3", default-features = false }
# lectern-logging's facade (docs/adr/0046.md): `std` and `kv` only, which
# have no dependencies of their own. Already in the release build through
# GPUI. Only lectern-logging depends on it directly; every other crate logs
# through lectern-logging's macros. No `max_level_*` feature anywhere.
log = { version = "0.4.34", default-features = false, features = ["std", "kv"] }
# Snapshot tests for domain logic (AGENTS.md). Test-only.
insta = "1.49"
# Test-only: temporary directories for lectern-platform's tests, and mkfifo in
# its macOS tests (rustix has no mkfifoat on Apple targets).
tempfile = "3.27"
libc = "0.2"
trybuild = "1.0"

# Debug builds: optimize dependencies (GPUI is unusably slow at opt-level 0)
# but keep our own crates at opt-level 0 so incremental rebuilds stay fast.
[profile.dev]
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
